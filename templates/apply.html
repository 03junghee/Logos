{% extends 'base.html' %}

{% block title %}지원하기{% endblock %}

{% block content %}
<div class="py-5 text-center">
    <div data-aos="zoom-out" class="mb-5">
        <h2 class="display-4 fw-bold">Ready to Start?</h2>
    </div>

    <div class="row justify-content-center">
        <div class="col-md-6">
            <!-- 메인 지원 카드 -->
            <div class="logos-card p-5 mb-4" data-aos="fade-up">
                <h3 class="mb-4 text-white">멘토링 신청하기</h3>
                <p class="text-dim mb-4">밑에 신청하기 버튼으로 멘토링을 신청하세요</p>
                <a href="https://moaform.com/q/BomWHH" target="_blank" class="btn-logos w-100 py-3 fs-5 mb-4">신청하기</a>
                
                <!-- 카드 내부 하단에 문의 링크 배치 (더 깔끔함) -->
                <div class="pt-4 border-top" style="border-color: rgba(255, 255, 255, 0.1) !important;">
                    <p class="text-dim small mb-3">문의 사항이 있으시면 실시간 채팅 상담을 이용해 주세요.</p>
                    <a href="https://open.kakao.com/o/skPhlRui" target="_blank" class="btn btn-sm btn-outline-info px-4">문의하기</a>
                </div>
            </div>

            <!-- 카드 바깥 하단에 두고 싶다면 이 주석을 해제하고 위 pt-4 영역을 지우세요 -->
            <!-- 
            <div class="text-center" data-aos="fade-up" data-aos-delay="200">
                <a href="https://open.kakao.com/o/skPhlRui" target="_blank" class="text-info text-decoration-none small">
                    문의 사항이 있다면? 오픈 카톡방 바로가기 →
                </a>
            </div> 
            -->
        </div>
    </div>
</div>
{% endblock %}
